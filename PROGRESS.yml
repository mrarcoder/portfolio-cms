decisions:
  - One Next.js application and one Worker; no monorepo packages.
  - One theme; no blog, theme ecosystem, or import/export in V1.
  - Use same-origin API forwarding so browser sessions work on provider subdomains.
  - Protect initial setup with a deployment token and singleton database constraint.
  - Prefer fresh server reads before introducing caching.
maintenance: Update this file after each implementation task; record actual checks and unresolved issues, not intended results.
